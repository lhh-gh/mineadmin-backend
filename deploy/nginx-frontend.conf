# Install as /etc/nginx/sites-available/mineadmin-frontend after changing server_name.
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    root /opt/mineadmin/current/frontend;
    index index.html;
    client_max_body_size 4m;

    location = /prod {
        return 308 /prod/$is_args$args;
    }

    # The trailing slash strips /prod/ before forwarding to Hyperf.
    location ^~ /prod/ {
        proxy_pass http://127.0.0.1:9501/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /uploads {
        return 301 /uploads/;
    }

    location /uploads/ {
        alias /opt/mineadmin/shared/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Let pages opened before an upgrade finish loading the previous assets.
    location /static/ {
        try_files $uri @previous_static;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location @previous_static {
        root /opt/mineadmin/previous/frontend;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
