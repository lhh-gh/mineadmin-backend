name: mineadmin-dev

services:
  hyperf:
    image: mineadmin-backend:dev
    build:
      context: ./deploy
      dockerfile: Dockerfile.dev
    pull_policy: build
    init: true
    user: "${LOCAL_UID:?Set LOCAL_UID in .env from id -u}:${LOCAL_GID:?Set LOCAL_GID in .env from id -g}"
    working_dir: /opt/www
    volumes:
      - ./:/opt/www
    ports:
      - "127.0.0.1:${LOCAL_HTTP_PORT:-9501}:9501"
    environment:
      TZ: Asia/Shanghai
      APP_ENV: dev
      SCAN_CACHEABLE: "false"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "9501"
      SWOOLE_WORKER_NUM: "1"
      COMPOSER_HOME: /tmp/composer
      # Docker Desktop reaches Windows FlyEnv via this hostname.
      # The application reads credentials and ports from the mounted .env.
      DB_HOST: "${LOCAL_DB_HOST:-host.docker.internal}"
      REDIS_HOST: "${LOCAL_REDIS_HOST:-host.docker.internal}"
    command:
      - php
      - -d
      - swoole.use_shortname=Off
      - bin/hyperf.php
      - server:watch
